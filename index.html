<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шкафчик</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fb;--panel:#fff;--ink:#16143a;--mute:#6b6d92;--line:#dcdff0;--accent:#5b4dff;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--panel:#1d1a40;--ink:#f1f0ff;--mute:#9a98c8;--line:#2e2a5e;--accent:#7fd4ff;--on:#14122b}}
:root[data-theme="dark"]{--bg:#14122b;--panel:#1d1a40;--ink:#f1f0ff;--mute:#9a98c8;--line:#2e2a5e;--accent:#7fd4ff;--on:#14122b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:18px 14px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:800}
.sub{color:var(--mute);font-size:13px}
.total{font-size:54px;font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--accent)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer;text-align:left}
.tab b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.tab span{font-size:12px;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.tab[aria-selected="true"] span{color:inherit;opacity:.8}
input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;margin-bottom:12px}
.tab:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.card{background:var(--panel);border-radius:10px;overflow:hidden;border-bottom:4px solid var(--c,#9aa3ad)}
.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--line)}
.card span{display:block;padding:5px 6px 6px;font-size:12px;line-height:1.2;min-height:2.6em}
.msg{color:var(--mute);font-size:13px;margin:12px 0}
</style>
</head>
<body>
<main>
<header>
<div><h1 id="nick">Шкафчик</h1><div class="sub" id="sub">загружаю каталог…</div></div>
<div class="total" id="total">0</div>
</header>
<div class="tabs" id="tabs" role="tablist"></div>
<input id="q" type="search" placeholder="Найти предмет" autocomplete="off">
<div class="grid" id="grid"></div>
<div class="msg" id="msg"></div>
</main>
<script>
var API="https://fortnite-api.com/v2/cosmetics/br?language=ru";
var TYPES=[["outfit","Скины"],["backpack","Рюкзаки"],["pickaxe","Кирки"],["glider","Дельтапланы"],["emote","Эмоции"],["wrap","Обёртки"],["contrail","Следы"],["loadingscreen","Загрузка"],["music","Музыка"],["spray","Спреи"],["emoji","Смайлы"],["toy","Игрушки"]];
var RANK=["mythic","legendary","icon","marvel","dc","starwars","gaminglegends","dark","shadow","slurp","frozen","lava","epic","rare","uncommon","common"];
var COL={mythic:"#ffd24a",legendary:"#f29a2e",epic:"#b95cf4",rare:"#3fa9f5",uncommon:"#6fcf4a",common:"#9aa3ad"};
var NOTE="", P=new URLSearchParams(location.search), by={}, cur="outfit", demo=!P.get("d");
document.getElementById("nick").textContent=P.get("n")||(demo?"Демо":"Шкафчик");
function bits(s){ // "N.base64url" -> {n, test(i)}
var a=s.split("."), b=a[1].replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4)b+="=";
var bin=atob(b), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
return {n:+a[0],test:function(i){return (u[i>>3]>>(i&7))&1}};
}
function rank(r){var i=RANK.indexOf(r);return i<0?99:i}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
fetch(API).then(function(r){return r.json()}).then(function(j){
var all=j.data.map(function(c){return{l:c.id.toLowerCase(),name:c.name,type:(c.type||{}).value,rar:(c.rarity||{}).value,img:(c.images||{}).smallIcon}});
all.sort(function(a,b){return a.l<b.l?-1:a.l>b.l?1:0});
var mine;
if(demo){mine=all.filter(function(_,i){return i%30===0});}
else{var B=bits(P.get("d")); mine=all.filter(function(_,i){return B.test(i)});
if(B.n!==all.length) NOTE="Каталог предметов обновился, часть предметов может отображаться неточно.";}
TYPES.forEach(function(t){by[t[0]]=mine.filter(function(c){return c.type===t[0]}).sort(function(a,b){return rank(a.rar)-rank(b.rar)||a.name.localeCompare(b.name)})});
var total=TYPES.reduce(function(s,t){return s+by[t[0]].length},0);
document.getElementById("total").textContent=total;
document.getElementById("sub").textContent=demo?"демо: откройте через бота":"предметов в шкафчике";
document.getElementById("tabs").innerHTML=TYPES.map(function(t){return'<button class="tab" role="tab" data-k="'+t[0]+'"><b>'+by[t[0]].length+'</b><span>'+t[1]+'</span></button>'}).join("");
render();
}).catch(function(){document.getElementById("sub").textContent="";document.getElementById("msg").textContent="Не удалось загрузить каталог предметов. Проверьте интернет и откройте шкафчик заново.";});
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(b){cur=b.dataset.k;render();}});
document.getElementById("q").addEventListener("input",render);
function render(){
var q=document.getElementById("q").value.trim().toLowerCase();
Array.prototype.forEach.call(document.getElementById("tabs").children,function(b){b.setAttribute("aria-selected",b.dataset.k===cur)});
var items=(by[cur]||[]).filter(function(c){return c.name.toLowerCase().indexOf(q)>-1});
document.getElementById("grid").innerHTML=items.map(function(c){
return'<div class="card" style="--c:'+(COL[c.rar]||"#ffd24a")+'"><img loading="lazy" alt="" onerror="this.style.opacity=.25" src="'+esc(c.img||"")+'"><span>'+esc(c.name)+'</span></div>'}).join("");
document.getElementById("msg").textContent=(!items.length&&(by[cur]||[]).length)?"Ничего не найдено. Проверьте написание.":NOTE;
}
</script>
</body>
</html>
