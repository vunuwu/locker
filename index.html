<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шкафчик</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fb;--panel:#fff;--ink:#16143a;--mute:#6b6d92;--line:#dcdff0;--accent:#5b4dff;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--panel:#1d1a40;--ink:#f1f0ff;--mute:#9a98c8;--line:#2e2a5e;--accent:#7fd4ff;--on:#14122b}}
:root[data-theme="dark"]{--bg:#14122b;--panel:#1d1a40;--ink:#f1f0ff;--mute:#9a98c8;--line:#2e2a5e;--accent:#7fd4ff;--on:#14122b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
main{width:100%;max-width:none;margin:0 auto;padding:8px 4px 12px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{margin:0;font-size:22px;font-weight:800}
.sub{color:var(--mute);font-size:13px}
.total{font-size:54px;font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:3px 0 6px}
.tab{min-width:0;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:4px 2px;font:inherit;cursor:pointer;text-align:center;line-height:1.1}
.tab b{display:block;font-size:13px;font-weight:800;line-height:1.05}
.tab span{font-size:8px;color:var(--mute);display:block;line-height:1.1;overflow-wrap:anywhere}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.tab[aria-selected="true"] span{color:inherit;opacity:.8}
input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;margin-bottom:12px}
.tab:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px 4px}
.grid.big{grid-template-columns:repeat(13,minmax(0,1fr));gap:5px 3px}
.grid.big .card span{font-size:6.5px;line-height:7.5px;min-height:15px}
.card{min-width:0;display:flex;flex-direction:column;gap:2px}
.card .ic{position:relative;width:100%;aspect-ratio:1/1;border-radius:7px;overflow:hidden;background:linear-gradient(160deg,var(--bar,#9aa3ad),color-mix(in srgb,var(--bar,#9aa3ad) 80%,#000));box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.card img{display:block;width:100%;height:100%;object-fit:cover;background:transparent}
.card span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:7px;line-height:8px;min-height:16px;text-align:left;overflow-wrap:anywhere;word-break:break-word;color:var(--ink)}
.msg{color:var(--mute);font-size:11px;margin:6px 0}
.pagebar{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0}
.pagebar button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 12px;font:inherit}
.pagebar button:disabled{opacity:.35}
@media(max-width:360px){.tabs{gap:2px}.tab{padding:3px 1px}.tab b{font-size:12px}.tab span{font-size:7px}.grid{gap:5px 3px}}</style>
</head>
<body>
<main>
  <header>
    <div><h1 id="nick">Шкафчик</h1><div class="sub" id="sub">загружаю каталог…</div></div>
    <div class="total" id="total">0</div>
  </header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <input id="q" type="search" placeholder="Найти предмет" autocomplete="off">
  <div class="grid" id="grid"></div>
  <div class="pagebar"><button id="prev" type="button">←</button><span id="pageinfo">1 / 1</span><button id="next" type="button">→</button></div>
  <div class="msg" id="msg"></div>
</main>
<script>
var API="https://fortnite-api.com/v2/cosmetics/br?language=ru";
var TYPES=[["outfit","Скины"],["backpack","Рюкзаки"],["pickaxe","Кирки"],["glider","Дельтапланы"],["emote","Эмоции и эмодзи"],["wrap","Обёртки"],["contrail","Следы"],["loadingscreen","Загрузка"],["music","Музыка"],["spray","Спреи"],["toy","Игрушки"],["exclusive","Все эксклюзивы"]];
var RANK=["mythic","legendary","icon","marvel","dc","starwars","gaminglegends","dark","shadow","slurp","frozen","lava","epic","rare","uncommon","common"];
var GLOW={mythic:"rgba(255,210,74,.62)",legendary:"rgba(242,154,46,.58)",epic:"rgba(185,92,244,.55)",rare:"rgba(63,169,245,.52)",uncommon:"rgba(111,207,74,.48)",common:"rgba(154,163,173,.38)"};
var BAR={mythic:"#ffd24a",legendary:"#f29a2e",epic:"#b95cf4",rare:"#3fa9f5",uncommon:"#6fcf4a",common:"#9aa3ad",icon:"#4fd8e8",marvel:"#e23b3b",dc:"#3b6fe2",starwars:"#4a8fd8",gaminglegends:"#8a5cf4",dark:"#d84ad0",shadow:"#777b86",slurp:"#2fd0c0",frozen:"#8fd8ff",lava:"#ff6a2a"};
var NOTE="", P=new URLSearchParams(location.search), by={}, cur="outfit", demo=!P.get("d"), page=0, PAGE_SIZE=1000000;
document.getElementById("nick").textContent=P.get("n")||(demo?"Демо":"Шкафчик");
function bits(s){ // "N.base64url" -> {n, test(i)}
  var a=s.split("."), b=a[1].replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4)b+="=";
  var bin=atob(b), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return {n:+a[0],test:function(i){return (u[i>>3]>>(i&7))&1}};
}
function rank(r){var i=RANK.indexOf(r);return i<0?99:i}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
fetch(API).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){
  if(!j||!Array.isArray(j.data))throw new Error("Некорректный ответ каталога");
  var all=j.data.map(function(c){return{l:c.id.toLowerCase(),name:c.name,type:(c.type||{}).value,rar:(c.rarity||{}).value,img:(c.images||{}).smallIcon||(c.images||{}).icon||(c.images||{}).featured,series:(c.series||{}).value||"",set:(c.set||{}).value||"",tags:c.gameplayTags||[],shopHistory:c.shopHistory||[]}});
  all.sort(function(a,b){return a.l<b.l?-1:a.l>b.l?1:0});
  var mine;
  if(demo){mine=all.filter(function(_,i){return i%30===0});}
  else{var B=bits(P.get("d")); mine=all.filter(function(_,i){return B.test(i)});
    if(B.n!==all.length) NOTE="Каталог предметов обновился, часть предметов может отображаться неточно.";}
  TYPES.forEach(function(t){if(t[0]==="exclusive")return;by[t[0]]=mine.filter(function(c){return t[0]==="emote"?(c.type==="emote"||c.type==="emoji"):c.type===t[0]}).sort(function(a,b){if(t[0]==="emote"){var typeOrder=(a.type==="emote"?0:1)-(b.type==="emote"?0:1);if(typeOrder)return typeOrder;}return rank(a.rar)-rank(b.rar)||a.name.localeCompare(b.name)})});
  // Эксклюзивы: скины, рюкзаки, кирки и эмоции/эмодзи оранжевой или жёлтой редкости.
  by.exclusive=mine.filter(function(c){
    var wanted=c.type==="outfit"||c.type==="backpack"||c.type==="pickaxe"||c.type==="emote"||c.type==="emoji";
    var highlighted=c.rar==="legendary"||c.rar==="mythic";
    return wanted&&highlighted;
  }).sort(function(a,b){return rank(a.rar)-rank(b.rar)||a.name.localeCompare(b.name)});
  var total=mine.length;
  document.getElementById("total").textContent=total;
  document.getElementById("sub").textContent=demo?"демо: откройте через бота":"предметов в шкафчике";
  document.getElementById("tabs").innerHTML=TYPES.map(function(t){return'<button class="tab" role="tab" data-k="'+t[0]+'"><b>'+by[t[0]].length+'</b><span>'+t[1]+'</span></button>'}).join("");
  render();
}).catch(function(err){document.getElementById("sub").textContent="";document.getElementById("msg").textContent="Не удалось загрузить каталог предметов. Проверьте подключение к интернету и попробуйте обновить страницу. ("+(err&&err.message?err.message:"ошибка сети")+")";});
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(b){cur=b.dataset.k;page=0;render();}});
document.getElementById("q").addEventListener("input",function(){page=0;render();});
document.getElementById("prev").addEventListener("click",function(){if(page>0){page--;render();}});
document.getElementById("next").addEventListener("click",function(){page++;render();});
function render(){
  var q=document.getElementById("q").value.trim().toLowerCase();
  Array.prototype.forEach.call(document.getElementById("tabs").children,function(b){b.setAttribute("aria-selected",b.dataset.k===cur)});
  var items=(by[cur]||[]).filter(function(c){return c.name.toLowerCase().indexOf(q)>-1});
  var pages=Math.max(1,Math.ceil(items.length/PAGE_SIZE));page=Math.min(page,pages-1);
  var shown=items.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);
  document.getElementById("pageinfo").textContent=(page+1)+" / "+pages;
  document.getElementById("prev").disabled=page===0;document.getElementById("next").disabled=page>=pages-1;
  document.getElementById("grid").className="grid"+((by[cur]||[]).length>100?" big":"");
  document.getElementById("grid").innerHTML=shown.map(function(c){
    return'<div class="card" style="--glow:'+(GLOW[c.rar]||"rgba(255,210,74,.42)")+';--bar:'+(BAR[c.series&&BAR[c.series.toLowerCase()]?c.series.toLowerCase():c.rar]||"#9aa3ad")+'"><div class="ic"><img loading="lazy" decoding="async" alt="" onerror="this.style.opacity=.25" src="'+esc(c.img||"")+'"></div><span>'+esc(c.name)+'</span></div>'}).join("");
  document.getElementById("msg").textContent=(!items.length&&(by[cur]||[]).length)?"Ничего не найдено. Проверьте написание.":NOTE;
}
</script>
</body>
</html>
